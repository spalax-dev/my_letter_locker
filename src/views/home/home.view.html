<div class="app-page">

  <!-- Header compartido con branding -->
  <header class="app-header">
    <span class="app-brand">
      <i data-lucide="file-text" class="brand-icon"></i>
      Letter Locker
    </span>
    <span class="app-header-mode">Modo Edición</span>
  </header>

  <!-- Área del editor -->
  <main class="editor-main">
    <div class="editor-meta">
      <span class="meta-filename">Documento sin título</span>
      <span class="meta-wordcount" id="word-count">0 palabras</span>
    </div>

    <textarea id="editor" class="editor-textarea" placeholder="Empieza a escribir tu carta aquí..."></textarea>
  </main>

  <!-- Barra de herramientas inferior -->
  <footer class="toolbar">
    <div class="toolbar-container">

      <div class="toolbar-actions">
        <button class="btn-utility" id="open-preview-btn">
          <i data-lucide="eye" class="icon-slate"></i>
          <span>Vista previa</span>
        </button>

        <button class="btn-utility">
          <i data-lucide="terminal" class="icon-slate"></i>
          <span>Comandos</span>
        </button>
      </div>

      <div class="toolbar-status">
        <span>UTF-8</span>
      </div>

    </div>
  </footer>

  <!-- Modal de vista previa -->
  <div id="preview-modal" class="modal-overlay">
    <div class="modal-card">

      <header class="modal-header">
        <div class="modal-title">
          <i data-lucide="eye" class="icon-slate"></i>
          <h2>Vista Previa</h2>
        </div>
        <button class="btn-close-modal" aria-label="Cerrar vista previa">
          <i data-lucide="x" class="icon-slate"></i>
        </button>
      </header>

      <div class="modal-content markdown-body" id="preview-content"></div>

      <footer class="modal-footer">
        <span class="text-xs text-slate-400">Modo lectura activo</span>
        <button class="btn-primary-modal" id="close-preview-btn">Cerrar</button>
      </footer>

    </div>
  </div>

</div>
