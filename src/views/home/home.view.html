<style>
  .container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 4em;
    padding: 5em;
    font-family: inter;

    --gray: #e0e0e0c0;
    --gray2: #eae8e8c0;
  }

  #inp {
    border: 1px solid var(--gray);
    box-shadow: 0px 2px 4px 0px var(--gray);
    resize: none;
    height: 30em;
    padding: 1em;
    font: inherit;
  }

  .preview-container {
    box-shadow: 0px 2px 4px 0px var(--gray);
    border: 1px solid var(--gray);
  }

  .preview-title {
    font-weight: bold;
    padding: 1em;
    border: 1px solid var(--gray);
    background-color: var(--gray2);
  }

  #preview {
    height: 30em;
    width: 100%;
    height: 100%;
    flex-shrink: 1;
    flex-grow: 1;
    padding: 1em;
    white-space: pre-wrap; /* This preserves newlines and wraps text */

  }

</style>

<div class="container">
  <textarea name="" id="inp"></textarea>

  <div class="preview-container" style="width: 100%; display: flex; flex-direction: column;">
    <div class="preview-title">
      Preview
    </div>
    <div id="preview"></div>
  </div>
</div>
