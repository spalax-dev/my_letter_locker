<div class="app-page">

  <!-- Header compartido con branding -->
  <header class="app-header">
    <span class="app-brand">
      <picture class="app-logo h-6 w-auto">
        <source srcset="/logo-dark.svg" media="(prefers-color-scheme: dark)">
        <source srcset="/logo-light.svg" media="(prefers-color-scheme: light)">
        <img src="/logo-light.svg" alt="Logo" class="h-6 w-auto">
      </picture>
    </span>
    <span class="app-header-mode">
  </header>

  <!-- Contenido principal -->
  <main class="reader-main">

    <div class="reader-header">
      <h1 class="reader-title">Cartas recibidas</h1>
      <p class="reader-subtitle">Cartas que has descifrado en este dispositivo</p>
    </div>

    <!-- Lista de cartas -->
    <div id="history-list" class="history-list">
      <!-- Se rellena dinámicamente -->
    </div>

    <!-- Estado vacío -->
    <div id="history-empty" class="history-empty" style="display:none;">
      <i data-lucide="inbox" class="history-empty-icon"></i>
      <p class="history-empty-text">Aún no has leído ninguna carta</p>
      <p class="history-empty-sub">Las cartas que descifres aparecerán aquí</p>
    </div>

  </main>

</div>
