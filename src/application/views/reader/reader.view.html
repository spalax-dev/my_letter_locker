<div id="reader-page" class="reader-page">

  <div class="reader-content">
    <h1 id="letter-title" class="reader-title"></h1>
    <div id="letter-content" class="reader-body"></div>
  </div>

</div>

<div id="decryption-modal" class="reader-modal">
  <div class="modal-centered">
    <div class="modal-box">
      <div class="modal-header-row">
        <span class="modal-label">Carta cifrada</span>
      </div>
      <p class="modal-description">Esta carta está protegida con una contraseña.</p>
      <input
        type="password"
        id="decryption-key-input"
        class="modal-input"
        placeholder="Clave secreta..."
        autocomplete="off"
      />
      <p id="decryption-error" class="modal-error" style="display:none;">Clave incorrecta.</p>
      <div class="modal-actions">
        <button class="modal-btn-cancel" id="close-decryption-modal-btn">Cancelar</button>
        <button class="modal-btn-primary" id="decrypt-btn">Descifrar</button>
      </div>
    </div>
  </div>
</div>
