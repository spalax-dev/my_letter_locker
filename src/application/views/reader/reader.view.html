<div class="app-page">

  <!-- Header compartido con branding -->
  <header class="app-header">
    <span class="app-brand">
      <div class="app-logo">
        <img src="/logo-light.svg" alt="Logo" class="h-6 w-auto dark:hidden">
        <img src="/logo-dark.svg" alt="Logo" class="h-6 w-auto hidden dark:block">
      </div>
    </span>
    <span class="app-header-mode">
      <button id="theme-toggle" class="p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
        <svg id="sun-icon" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <svg id="moon-icon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      </button>
    </span>
  </header>

  <!-- Contenido principal -->
  <main class="reader-main">

    <div class="reader-header">
      <h1 class="reader-title">Cartas recibidas</h1>
      <p class="reader-subtitle">Cartas que has descifrado en este dispositivo</p>
    </div>

    <!-- Lista de cartas -->
    <div id="history-list" class="history-list">
      <!-- Se rellena dinámicamente -->
    </div>

    <!-- Estado vacío -->
    <div id="history-empty" class="history-empty" style="display:none;">
      <i data-lucide="inbox" class="history-empty-icon"></i>
      <p class="history-empty-text">Aún no has leído ninguna carta</p>
      <p class="history-empty-sub">Las cartas que descifres aparecerán aquí</p>
    </div>

  </main>

</div>
