<div class="readcard-page">
  <main class="readcard-content">
    <h1 id="letter-title" class="readcard-title"></h1>
    <div id="letter-content" class="readcard-body"></div>
  </main>
  <footer class="readcard-footer">
    <hr class="readcard-divider" />
    <a href="/" class="readcard-footer-link">Written in My Letter Locker</a>
  </footer>
</div>

<div id="decryption-modal" class="modal-overlay">
  <div class="modal-card modal-card--sm">
    <header class="modal-header">
      <div class="modal-title">
        <i data-lucide="lock" class="icon-slate"></i>
        <h2>Encrypted letter</h2>
      </div>
      <button class="btn-close-modal" id="close-decryption-modal-btn" aria-label="Close">
        <i data-lucide="x" class="icon-slate"></i>
      </button>
    </header>
    <div class="modal-content">
      <p class="text-sm text-slate-500 mb-4">This letter is protected with a passphrase. Enter the key to decrypt and read its content.</p>
      <input
        type="password"
        id="decryption-key-input"
        class="key-input-field"
        placeholder="Secret key..."
        autocomplete="off"
      />
      <p id="decryption-error" class="input-error-msg" style="display:none;">The provided key is incorrect.</p>
    </div>
    <footer class="modal-footer">
      <span></span>
      <button class="btn-primary-modal" id="decrypt-btn">Decrypt</button>
    </footer>
  </div>
</div>
